name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin supports every DSH line it declares in peerDependencies.
        # Pinning the peer set here is the only way to catch API drift: the
        # lockfile is a single point in time, and a prerelease tuple bump
        # (0.2.0-rc.x -> 0.2.1-rc.x) is invisible to a plain `npm install`.
        dsh: ["0.1.0-rc.6", "0.2.0-rc.2", "0.2.1-rc.2"]
    name: dsh ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Resolve the WHOLE tree from scratch for this leg. Overlaying a pinned
      # peer set onto a tree resolved for another DSH line produces an
      # incoherent module graph (a nested package ended up unable to resolve
      # `@deepseek-ai/cordis`), and `--legacy-peer-deps` makes it worse by not
      # installing peers at all. A lockfile-free install lets npm build a
      # consistent closure per leg.
      - name: Install (fresh resolution on the ${{ matrix.dsh }} line)
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund --save-dev \
            @deepseek-ai/cordis@4.0.5 \
            @deepseek-ai/schemastery@3.18.5 \
            @deepseek-ai/dsh-web@${{ matrix.dsh }} \
            @deepseek-ai/dsh-settings@${{ matrix.dsh }} \
            @deepseek-ai/dsh-credentials@${{ matrix.dsh }} \
            @deepseek-ai/dsh-llm@${{ matrix.dsh }} \
            @deepseek-ai/dsh-api-remotes@${{ matrix.dsh }} \
            @deepseek-ai/dsh-client-connection@${{ matrix.dsh }} \
            @deepseek-ai/dsh-client-locale@${{ matrix.dsh }} \
            @deepseek-ai/dsh-client-ui-primitives@${{ matrix.dsh }} \
            @deepseek-ai/dsh-client-ui-settings@${{ matrix.dsh }} \
            @deepseek-ai/dsh-client-ui-slots@${{ matrix.dsh }}

      - name: Report resolved peer versions
        run: |
          echo -n "cordis: "
          node -p "require('@deepseek-ai/cordis/package.json').version"
          for p in dsh-web dsh-llm dsh-client-ui-primitives; do
            echo -n "$p: "
            node -p "require('@deepseek-ai/$p/package.json').version"
          done

      # A pinned devDependency can resolve to a different line than requested;
      # fail loudly instead of silently testing the wrong runtime.
      - name: Assert the resolved DSH line matches the matrix
        env:
          WANT: ${{ matrix.dsh }}
        run: |
          node -e "const w=process.env.WANT;const g=require('@deepseek-ai/dsh-web/package.json').version;if(g!==w){console.error('expected '+w+', resolved '+g);process.exit(1)}console.log('resolved line OK: '+g)"

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
